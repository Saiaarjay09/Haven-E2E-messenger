<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Haven web client end-to-end test</title></head>
<body>
<pre id="out">running (this takes a few seconds — scrypt is deliberately slow)...</pre>
<script src="js/crypto.js?v=19"></script>
<script src="js/storage.js?v=19"></script>
<script src="js/network.js?v=19"></script>
<script src="js/auth.js?v=19"></script>
<script>
const H = Haven;
const out = [];
function log(msg) { out.push(msg); console.log(msg); }
let failures = 0;
function assertEq(actual, expected, label) {
  if (actual !== expected) {
    log(`FAIL: ${label}\n  expected: ${JSON.stringify(expected)}\n  actual:   ${JSON.stringify(actual)}`);
    failures++;
  } else {
    log(`PASS: ${label}`);
  }
}
function assertTrue(cond, label) {
  if (!cond) { log(`FAIL: ${label}`); failures++; } else { log(`PASS: ${label}`); }
}

function waitUntil(predicate, timeoutMs = 8000, intervalMs = 50) {
  return new Promise((resolve, reject) => {
    const deadline = Date.now() + timeoutMs;
    const tick = () => {
      if (predicate()) return resolve(true);
      if (Date.now() > deadline) return resolve(false);
      setTimeout(tick, intervalMs);
    };
    tick();
  });
}

const ACCOUNTS_URL = "http://localhost:8000";
const RELAY_WS_URL = "ws://localhost:8444";
const rand = () => Math.random().toString(36).slice(2);

async function makeClient(username, password) {
  const accounts = new HavenAuth.AccountsClient(ACCOUNTS_URL);
  const { identity, recoveryPhrase } = await accounts.signup(username, password);
  const store = await HavenStorage.Store.open(username, identity.privateBytes);
  const net = new HavenNetwork.NetworkManager(identity, username, store);
  const received = [];
  net.onMessage = (fp, kind, text) => received.push({ fp, kind, text });
  const relay = new HavenNetwork.RelayClient(identity, username, RELAY_WS_URL);
  net.attachRelay(relay);
  relay.start();
  return { username, password, identity, store, net, relay, received, recoveryPhrase, accounts };
}

async function main() {
  const aliceName = "e2e_alice_" + rand();
  const bobName = "e2e_bob_" + rand();

  // --- signup + login round trip against the real accounts service ---
  const alice = await makeClient(aliceName, "alice-e2e-password-123");
  assertTrue(alice.recoveryPhrase.split(" ").length === 12, "signup returns a 12-word recovery phrase");

  const reloggedIn = await alice.accounts.login(aliceName, "alice-e2e-password-123");
  assertEq(H.bytesToHex(reloggedIn.identity.privateBytes), H.bytesToHex(alice.identity.privateBytes), "login recovers the identical identity key generated at signup");

  const bob = await makeClient(bobName, "bob-e2e-password-456");

  assertTrue(await waitUntil(() => alice.relay.connected), "alice's relay connects");
  assertTrue(await waitUntil(() => bob.relay.connected), "bob's relay connects");

  // --- handshake + message exchange over the real WebSocket relay ---
  const fp = await alice.net.connectRelay(bob.identity.publicBytes, bobName);
  assertTrue(await waitUntil(() => alice.net.isConnected(fp)), "alice establishes a session with bob");
  assertTrue(await waitUntil(() => bob.net.isConnected(fp)), "bob establishes the SAME session (fingerprint) with alice");

  await alice.net.sendText(fp, "hello from the automated e2e test");
  assertTrue(await waitUntil(() => bob.received.some(m => m.text === "hello from the automated e2e test")), "bob receives alice's message, decrypted correctly");

  await bob.net.sendText(fp, "message received loud and clear");
  assertTrue(await waitUntil(() => alice.received.some(m => m.text === "message received loud and clear")), "alice receives bob's reply, decrypted correctly");

  // --- persisted, encrypted local history ---
  const aliceHistory = await alice.store.history(fp);
  assertTrue(aliceHistory.some(m => m.text === "hello from the automated e2e test" && m.direction === "out"), "alice's own sent message is in her local history");
  assertTrue(aliceHistory.some(m => m.text === "message received loud and clear" && m.direction === "in"), "bob's reply is in alice's local history");

  // --- forgot password, against the real accounts service ---
  const resetResult = await alice.accounts.resetPassword(aliceName, alice.recoveryPhrase, "alice-new-password-789");
  assertEq(H.bytesToHex(resetResult.identity.privateBytes), H.bytesToHex(alice.identity.privateBytes), "recovery-phrase password reset recovers the identical identity");

  let oldPasswordStillWorks = true;
  try { await alice.accounts.login(aliceName, "alice-e2e-password-123"); } catch (e) { oldPasswordStillWorks = false; }
  assertTrue(!oldPasswordStillWorks, "the OLD password no longer works after a recovery-phrase reset");

  const newLogin = await alice.accounts.login(aliceName, "alice-new-password-789");
  assertEq(H.bytesToHex(newLogin.identity.privateBytes), H.bytesToHex(alice.identity.privateBytes), "the NEW password works and unlocks the same identity");

  alice.relay.stop();
  bob.relay.stop();

  log(failures === 0 ? "\nALL END-TO-END WEB CLIENT TESTS PASSED" : `\n${failures} TEST(S) FAILED`);
  document.getElementById("out").textContent = out.join("\n");
  window.__testFailures = failures;
  window.__testsDone = true;
}

main().catch(e => {
  document.getElementById("out").textContent = out.join("\n") + "\n\nUNCAUGHT ERROR: " + e.stack;
  window.__testFailures = -1;
  window.__testsDone = true;
});
</script>
</body>
</html>
